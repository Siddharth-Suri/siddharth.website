<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Support · Siddharth Suri</title>
        <meta
            name="description"
            content="Support Siddharth Suri's open source projects."
        />
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2713%27 font-size=%2714%27 font-family=%27monospace%27%3E~%3C/text%3E%3C/svg%3E"
        />
        <link rel="stylesheet" href="/style.css" />
        <script src="/theme.js"></script>
        <script src="/support.js" defer></script>
    </head>
    <body>
        <header class="top">
            <a class="brand" href="/">~/siddharth</a>
            <nav>
                <a href="/">home</a>
                <span class="themes" role="group" aria-label="Theme">
                    <button type="button" data-set-theme="light">light</button>
                    <button type="button" data-set-theme="reader">
                        reader
                    </button>
                    <button type="button" data-set-theme="dark">dark</button>
                </span>
            </nav>
        </header>

        <main class="support">
            <h1>Support my projects</h1>
            <p class="muted">
                Mostly Everything I build is free and open source. If something
                of mine saved you time, you can chip in to keep it maintained.
            </p>

            <form id="pay-form">
                <div class="amounts" role="group" aria-label="Preset amount">
                    <button type="button" data-amount="5">$5</button>
                    <button type="button" data-amount="10">$10</button>
                    <button type="button" data-amount="25">$25</button>
                </div>
                <div class="pay">
                    <label for="amount">$</label>
                    <input
                        id="amount"
                        name="amount"
                        type="number"
                        min="1"
                        max="1000"
                        step="1"
                        value="10"
                        required
                    />
                    <button type="submit">support</button>
                </div>
                <p class="muted hint">
                    Opens PayPal in a new tab. Cards work without a PayPal
                    account.
                </p>
            </form>
        </main>

        <footer>
            <span>Payments are processed securely by PayPal.</span>
            <a href="/">← back home</a>
        </footer>
    </body>
</html>
